name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run ruff check factory apps tests
      - run: uv run ruff format --check factory apps tests
      - run: uv run pytest -q --junitxml=reports/runtime/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: reports/runtime/test-results.xml
