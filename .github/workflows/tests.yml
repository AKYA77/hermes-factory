name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      # tests/parity drives the Rust engine, so the binary must exist before
      # pytest runs. The rust job builds it again for its own checks.
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo build --release --locked
        working-directory: rust/raptor-engine
      - run: uv sync --frozen
      - run: uv run ruff check factory apps tests
      - run: uv run ruff format --check factory apps tests
      # Every dashboard API call must resolve to a backend route. This caught the
      # pause/resume path class of bug; --uncalled additionally reports routes with
      # no UI caller, which is how the remaining C7 wiring work is tracked.
      - run: uv run python scripts/check-dashboard-api-coverage.py
      - run: uv run pytest -q --junitxml=reports/runtime/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: reports/runtime/test-results.xml
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo build --release --locked
        working-directory: rust/raptor-engine
      - run: cargo test --release --locked
        working-directory: rust/raptor-engine
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run python scripts/parity_raptor_engine.py --cases 200 --instrument all --seed 20261112
      # A second seed catches case classes the first one never generates; the
      # shipped corpus once missed behaviour that only appeared under other draws.
      - run: uv run python scripts/parity_raptor_engine.py --cases 300 --instrument all --seed 4242
      - run: uv run python scripts/verify_raptor_goldens.py
      - run: uv run python scripts/parity_raptor_equity.py --cases 80 --seed 4242 --instrument EURUSD
      - run: uv run python scripts/parity_raptor_restart.py --cases 120 --instrument all
      - run: uv run python scripts/verify_goldens_without_nautilus.py
