[package]
name = "raptor-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RaptorBT-derived exact bid/ask execution engine for Hermes Factory"

[[bin]]
name = "raptor-engine"
path = "src/main.rs"

[lib]
name = "raptor_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
